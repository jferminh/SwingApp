# ====================================================================
# Configuration des logs pour l'application ECF DAO
# ====================================================================
# Version: 3.0
# Date: 22/01/2026
# ====================================================================

# ========== CONFIGURATION GLOBALE ==========

# Niveau global : WARNING (logs critiques uniquement)
.level=WARNING

# Handlers actifs (séparés par des virgules)
handlers=java.util.logging.FileHandler,java.util.logging.ConsoleHandler

# ========== NIVEAUX PAR PACKAGE ==========
# Permet de filtrer les logs par package/classe

# DAO : WARNING uniquement (suppression FINE pour performance)
main.com.julio.dao.level=WARNING

# Model : WARNING (pas de logs métier dans constructeurs)
main.com.julio.model.level=WARNING

# Service : WARNING (erreurs critiques uniquement)
main.com.julio.service.level=WARNING

# ViewModel : WARNING (erreurs critiques uniquement)
main.com.julio.viewmodel.level=WARNING

# Main : INFO (démarrage/arrêt application)
main.com.julio.Main.level=INFO

# DatabaseConnection : INFO (état connexion)
main.com.julio.db.DatabaseConnection.level=INFO

# ========== FILE HANDLER (Fichier de logs) ==========

# Pattern : logs/ecf_dao_0.log, logs/ecf_dao_1.log, etc.
java.util.logging.FileHandler.pattern=logs/ecf_dao_%u.log

# Taille max par fichier : 5 MB (5242880 bytes)
java.util.logging.FileHandler.limit=5242880

# Nombre de fichiers en rotation : 10
java.util.logging.FileHandler.count=10

# Niveau : ALL (tout enregistrer dans les fichiers)
java.util.logging.FileHandler.level=ALL

# Mode append : true (ajouter au fichier existant)
java.util.logging.FileHandler.append=true

# Formatter : CustomFormatter de LoggerService
java.util.logging.FileHandler.formatter=main.com.julio.service.LoggerService$CustomFormatter

# ========== CONSOLE HANDLER (Console/Sortie standard) ==========

# Niveau : INFO (informations + erreurs)
java.util.logging.ConsoleHandler.level=INFO

# Formatter : CustomFormatter de LoggerService
java.util.logging.ConsoleHandler.formatter=main.com.julio.service.LoggerService$CustomFormatter

